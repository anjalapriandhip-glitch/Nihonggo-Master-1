name: Build APK (Nihongo Master)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --org com.nihongo.master .

      - name: Arrange Flutter project
        run: |
          mkdir -p lib/screens
          mkdir -p lib/services
          mkdir -p lib/widgets
          mkdir -p assets/data

          mv -f main.dart lib/main.dart
          mv -f home_screen.dart lib/screens/home_screen.dart
          mv -f kotoba_screen.dart lib/screens/kotoba_screen.dart
          mv -f bunpo_screen.dart lib/screens/bunpo_screen.dart
          mv -f quiz_screen.dart lib/screens/quiz_screen.dart
          mv -f progress_screen.dart lib/screens/progress_screen.dart

          mv -f data_service.dart lib/services/data_service.dart
          mv -f progress_service.dart lib/services/progress_service.dart
          mv -f level_chips.dart lib/widgets/level_chips.dart
          mv -f models.dart lib/models.dart

          mv -f kotoba.json assets/data/kotoba.json
          mv -f bunpo.json assets/data/bunpo.json

      - name: Install packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nihongo-Master-APK
          path: build/app/outputs/flutter-apk/app-release.apk
